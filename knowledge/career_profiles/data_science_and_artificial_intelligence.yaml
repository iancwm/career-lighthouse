recruiting_timeline: 'Hiring ongoing; 10–20 new analysts/year at major fintechs. Capstone
  presentations attended by hiring managers — direct outreach before formal recruitment
  opens observed. Skill-based hiring: portfolio + coding test (SQL, Python) weighted
  over credentials.'
entry_paths:
- MITB AI Track (SMU)
- MITB Data Track (SMU)
- Technical bootcamp + strong portfolio
- Domain career pivot (banking/fintech) + upskilling
salary_range_2024: SGD 80–110K entry (0–2 yrs), SGD 110–150K mid (2–5 yrs), SGD 150–200K+
  senior (5+ yrs). Equity 0.05–0.15% at Series B–H stage. Bonus 10–20%. Domain knowledge
  in payments/fintech commands +15–20% comp premium.
typical_background: MITB AI/Data Track (1 year, technical + business literacy) is
  sweet spot. Domain knowledge (2–3 yrs banking/fintech) + ML skills = strong differentiator.
  Pure data engineering background requires 6 months to learn payments domain vs.
  3 months for domain-knowledgeable candidates.
notes: 'ACTION (Dr. James Tay, April 2025): Develop ''Data Analytics in FinTech''
  case study for SMU career advisory use. Core narrative: domain knowledge (UOB banking,
  5 yrs) + technical upskilling (MITB AI Track, 1 yr) + capstone project (fraud detection
  model) = direct hire at Stripe Singapore. Key differentiators to highlight: (1)
  banking domain knowledge accelerates onboarding vs. pure data engineers, (2) capstone
  portfolio > resume/interviews for fintech data analyst roles, (3) business impact
  storytelling as career differentiator beyond SQL/Python.'
structured:
