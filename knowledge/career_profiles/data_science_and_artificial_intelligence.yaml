match_description: Data analysts and data scientists in fintech and tech companies.
  Roles span fraud detection, payments analytics, A/B testing, and business intelligence.
  Strong demand in Singapore fintech sector (Stripe, Wise, Grab). MITB AI/Data Track
  is primary SMU entry pathway. Domain knowledge in banking/payments is a significant
  differentiator. Career ladder leads to Analytics Manager, Data Science Manager,
  or Product Management transition.
compass_score_typical: MITB AI/Data Track graduates with domain knowledge and strong
  capstone portfolio typically competitive. EP sponsorship available at major fintechs.
international_realistic: Yes, at major fintechs (Stripe, Wise, Grab). Verify EP sponsorship
  per employer. Skill-based hiring reduces credential barriers for international candidates
  with strong portfolios.
