notes: 'SMU MQF (MSc Quantitative Finance) cohort ~30/year; supply-constrained — all
  grads placed. Sub-tracks: (1) Model Validation — stable, specialist, lower comp
  ceiling SGD 180K director; (2) Quant Trading — highest comp SGD 150–250K, short
  runway ~10 years, volatile; (3) Model Development — balanced, growing in fintech,
  SGD 110–140K mid-level; (4) Quant Data Science (fintech) — SGD 110–150K, faster
  growth, broader exit options. Thesis topic is a direct hire signal: regulatory thesis
  (Basel III, backtesting) → banks; ML/fintech thesis → tech companies. MAS 2023 Model
  Governance Guidelines driving validation hiring surge through 2027+. Alumni contact:
  Cayden Lee (OCBC Senior Model Validator, SMU QF ''21 + MQF ''23). Counselor: Dr.
  Suresh Kumar.'
career_type: Quantitative Finance & Economic Research
entry_paths:
- SMU Quantitative Finance undergrad + MQF direct pipeline
- Year 3 6-month internship in Model Risk Management (DBS/UOB/OCBC)
- MQF thesis presentation — banks attend directly and recruit on-site
- Quant trading recruitment via campus (Citadel/DE Shaw/Winton poach top MQF students)
ep_sponsorship: Strong EP sponsorship prospects across all listed employers; MAS roles
  are Singapore citizen/PR preferred but select EP candidates for specialist quant
  positions. Private sector firms like Jane Street and DRW actively sponsor EP for
  exceptional quantitative talent.
international_realistic: true
recruiting_timeline: MQF thesis presentations Oct–Dec; offers Jan–Mar for June start.
  Undergrad internship Year 3 (6-month rotation) is primary pipeline entry point.
salary_range_2024: 'Model Validation entry: SGD 70–85K + 12–15% bonus. Model Validation
  senior: SGD 90–120K + 12–18% bonus. Model Development mid-level: SGD 110–140K. Quant
  Trading (Citadel/DE Shaw/Winton): SGD 150–250K total comp (volatile bonuses). Consulting
  lateral (EY/Deloitte model risk): SGD 120–160K mid-level. Fintech data scientist
  (Databricks/Wise/Grab): SGD 110–150K.'
typical_background: MSc Financial Economics, MSc Quantitative Finance, or BSc (Hons)
  Economics/Mathematics with strong econometrics and programming skills. Competitive
  candidates typically demonstrate proficiency in Python, R, and Stata, with coursework
  or research experience in time-series econometrics, stochastic calculus, or macroeconomic
  modelling. Prior internships in economic research, quantitative trading, or financial
  analysis significantly strengthen candidacy.
counselor_contact: Dr. Suresh Kumar
structured:
  salary_min_sgd: 70000
  salary_max_sgd: 85000
