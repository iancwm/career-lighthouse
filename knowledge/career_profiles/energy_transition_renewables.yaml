track_name: Energy Transition & Renewables
match_description: Emerging track for professionals building expertise in renewable
  energy partnerships, hydrogen, carbon capture (CCUS), solar/wind procurement, and
  energy transition strategy. Growing demand as energy majors reposition. Lower comp
  initially vs. traditional LNG but higher long-term growth trajectory.
