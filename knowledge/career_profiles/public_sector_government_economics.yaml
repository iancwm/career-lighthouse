career_type: Public Sector / Government Economics
track_name: Public Sector / Government Economics
match_description: Suited for candidates motivated by policy impact and regional influence
  over maximum compensation. Research output (working papers, policy briefs) drives
  advancement faster than tenure alone. Niche expertise in financial stability; exit
  options limited to academia, regional central banks, IMF/ADB.
match_keywords:
- macroeconomic research
- financial stability
- systemic risk
- monetary policy
- central banking
- policy briefs
- VAR modeling
- stress testing
- ASEAN
- fintech regulation
- credit cycles
- inflation dynamics
- Basel III
- countercyclical buffers
ep_sponsorship: Not applicable for MAS and most Singapore statutory boards — restricted
  to Singapore citizens and PRs.
top_employers_smu:
- monetary_authority_of_singapore
- economic_development_board
- housing_development_board
recruiting_timeline: Year-round; postgrad cohort intake typically May–July aligned
  with graduation. Direct entry post-grad common for research economist roles.
international_realistic: No — MAS and Singapore statutory boards restricted to Singapore
  citizens and PRs. Regional central banks (BNM, Bank of Thailand, Bank Indonesia)
  may be accessible for international candidates.
entry_paths:
- Direct entry post-grad (MSFE/MSc Econ/PhD)
- MAS internship → full-time conversion
- Structured mentorship program (Philip Chua, ~60% placement rate)
- Academic research → policy secondment
salary_range_2024: 'Entry Economist: SGD 72K–85K; Senior Economist: SGD 95K–105K (OTE
  ~SGD 113K with bonus); Specialist/Manager: SGD 130–160K; Director: SGD 160–180K.
  CPF 20% employer match + ESOS at senior levels.'
typical_background: MSFE, MSc Financial Economics, MSc Economics, or PhD. Policy-relevant
  thesis topics (financial cycles, inflation dynamics, credit risk) preferred. Quantitative
  modeling skills (VAR, stress-testing, agent-based modeling). Strong policy communication
  (Board-level brief writing). ASEAN/regional expertise valued.
counselor_contact: Dr. Suresh Kumar
notes: 'DEGREE GUIDANCE (from Philip Chua, MSFE ''16, April 2025): MSFE recommended
  if targeting financial stability, systemic risk, or macroprudential research roles
  (e.g., MAS financial stability unit). MSc Fin Econ more suitable for monetary policy
  or broader macro roles. MSFE curriculum (financial market dynamics, asset pricing,
  systemic risk) provides breadth valued by MAS for research roles. Thesis topic matters:
  policy-relevant topics (financial cycles, inflation dynamics, credit risk) signal
  better to MAS/central banks than pure financial theory. Research impact (publications
  + policy briefs) drives advancement over tenure alone — Philip promoted to Senior
  Economist in 4 years vs. typical 5–7.'
structured:
  salary_min_sgd: 72000
  salary_max_sgd: 85000
