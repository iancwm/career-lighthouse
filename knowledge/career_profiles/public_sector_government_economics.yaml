track_name: Public Sector / Government Economics
match_description: Suitable for candidates motivated by policy impact, regional economic
  influence, and long-term stability over maximum compensation. Requires strong quantitative
  and research skills; advancement driven by publication record and policy relevance,
  not purely tenure. Financial stability track (MAS) values MSFE curriculum breadth.
match_keywords:
- macroeconomic modeling
- financial stability
- systemic risk
- monetary policy
- VAR modeling
- stress testing
- policy research
- central banking
- ASEAN economics
- Basel III
- countercyclical buffers
- fintech regulation
- cross-border capital flows
ep_sponsorship: Not applicable for statutory boards (MAS, EDB, HDB). Roles restricted
  to Singapore citizens and PRs.
top_employers_smu:
- monetary_authority_of_singapore
- economic_development_board
- housing_development_board
- ministry_of_finance_singapore
recruiting_timeline: Annual graduate intake; applications typically open Q1–Q2 for
  July/August start. Policy-relevant thesis and research publications strongly valued
  by MAS.
international_realistic: No — statutory board roles restricted to Singapore citizens
  and PRs. Regional central bank roles (BNM, Bank of Thailand, Bank Indonesia) possible
  for international candidates with ASEAN expertise.
entry_paths:
- Direct entry post-graduate degree (MSFE, MSc Econ, PhD)
- MAS internship → conversion
- Philip Chua mentorship program (~60% MAS placement rate)
- Policy-relevant thesis + working paper publications
salary_range_2024: SGD 72K–85K (entry Economist) → SGD 95K–105K (Senior Economist,
  4–10 yrs) → SGD 130–160K (Specialist/Manager, 10–12 yrs) → SGD 160–180K (Director,
  12–15 yrs). OTE at Senior Economist ~SGD 113K including bonus. CPF 20% employer
  match adds significant non-cash value.
typical_background: MSFE or MSc Fin Econ (SMU, NUS, NTU). MSFE preferred for financial
  stability/systemic risk roles; MSc Fin Econ for monetary policy/broader macro. Policy-relevant
  thesis topics (financial cycles, inflation dynamics, credit risk) signal strongly.
  PhD valued for senior research roles.
counselor_contact: Dr. Suresh Kumar
notes: 'Key insight from Philip Chua (MAS Senior Economist, MSFE ''16): Research impact
  drives advancement — Philip promoted to Senior Economist in 4 years vs. typical
  5–7 due to 3 working papers + Board-level policy briefs. Mentoring as career leverage:
  signals leadership potential for director/manager track. Career mobility limited
  geographically (ASEAN central banks, IMF, ADB) but deep within policy ecosystem.
  Exit options: NUS/NTU academic roles, regional central banks, IMF/ADB. Private sector
  exit harder (corporate roles rarely need systemic risk specialists). Philip''s mentorship
  program: 10–15 postgrad alumni/year, 6-month cohorts, ~60% MAS placement. Encourage
  MSFE/econ grads to apply.'
structured:
  salary_min_sgd: 72000
  salary_max_sgd: 85000
