entry_paths:
- Engineering degree + 5–7 years energy ops + MBA (strongest for energy BD)
- MBA with energy capstone + domain internship
- Internal ops-to-commercial transfer post-MBA
salary_range_2024: 'Energy commercial partnerships (manager, 2–3 years): SGD 130–160K
  base + 15–25% bonus. OTE SGD 150–200K. Senior Manager: SGD 160–210K base. Director:
  SGD 210K+.'
notes: 'Energy sector commercial partnerships is a high-comp variant of this track.
  Engineers with 5–7 years energy ops + MBA can pivot to commercial partnerships at
  SGD 130–160K (manager). Domain expertise + MBA >> MBA alone in energy BD. Energy
  majors (ExxonMobil, Shell, TotalEnergies) recruit MBAs from technical fields specifically.
  Comp 15–25% higher than tech/fintech BD equivalents. Job security moderate — tied
  to commodity price cycles. Source: Rendall Tan alumni call (ExxonMobil Singapore,
  SMU MBA ''22), April 2025. Counsellor: Dr. Margaret Chen.'
structured:
  salary_min_sgd: 2000
  salary_max_sgd: 3000
career_type: Energy Commercial Partnerships / Business Development
ep_sponsorship: High — energy majors (ExxonMobil, Shell, TotalEnergies, BP) routinely
  sponsor Employment Passes for MBA hires with technical domain expertise; Singapore
  is a regional HQ hub for Asia-Pacific energy operations. EP eligibility strong given
  SGD 130K+ starting salaries well above MOM threshold.
international_realistic: true
recruiting_timeline: Off-cycle dominant — energy majors do not follow standard MBA
  recruiting calendar. Most roles posted Q1–Q3 on company career portals and LinkedIn.
  Internship conversion rare; lateral hire model preferred. Target outreach 6–9 months
  before intended start. SMU MBA career fairs have limited energy presence; direct
  networking and alumni referrals (e.g., ExxonMobil Singapore, Shell SEAP) are primary
  channels. On-campus recruiting limited to 1–2 firms annually.
top_employers_smu:
- ExxonMobil Asia Pacific (Singapore HQ)
- Shell SEAP (Singapore)
- TotalEnergies EP Asia
- BP Singapore
- Sembcorp Industries
- Keppel Energy
- Pavilion Energy
- Trafigura
- Vitol Asia
- Senoko Energy
typical_background: Engineering undergraduate (chemical, mechanical, electrical, or
  petroleum) with 5–7 years in energy operations, upstream/downstream technical roles,
  or LNG/power trading. MBA from SMU or NUS adds commercial credibility. Candidates
  without engineering background require exceptionally strong energy sector exposure
  (e.g., energy consulting, commodity trading) to compete. CFA or energy-specific
  certifications (CERA, GARP ERP) are differentiating but not required.
