entry_paths:
- Engineering degree + 5–7 years energy ops + MBA (strongest for energy BD)
- MBA with energy capstone + domain internship
- Internal ops-to-commercial transfer post-MBA
salary_range_2024: 'Energy commercial partnerships (manager, 2–3 years): SGD 130–160K
  base + 15–25% bonus. OTE SGD 150–200K. Senior Manager: SGD 160–210K base. Director:
  SGD 210K+.'
notes: 'Energy sector commercial partnerships is a high-comp variant of this track.
  Engineers with 5–7 years energy ops + MBA can pivot to commercial partnerships at
  SGD 130–160K (manager). Domain expertise + MBA >> MBA alone in energy BD. Energy
  majors (ExxonMobil, Shell, TotalEnergies) recruit MBAs from technical fields specifically.
  Comp 15–25% higher than tech/fintech BD equivalents. Job security moderate — tied
  to commodity price cycles. Source: Rendall Tan alumni call (ExxonMobil Singapore,
  SMU MBA ''22), April 2025. Counsellor: Dr. Margaret Chen.'
