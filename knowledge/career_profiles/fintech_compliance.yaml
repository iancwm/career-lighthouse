career_type: Fintech Compliance
match_description: Suited for law graduates (especially LLM in International Law,
  Financial Crime, or Regulatory Law) with interest in financial regulation, anti-money
  laundering, and in-house compliance roles at fintechs, banks, or regulators. LLM
  preferred over JD for compliance specialization.
match_keywords:
- AML
- KYC
- CFT
- sanctions screening
- FATF
- MAS
- PSA
- PDPA
- compliance
- financial crime
- regulatory reporting
- vendor due diligence
- SAR
- transaction monitoring
- legal ops
- in-house counsel
- fintech
- LLM
ep_sponsorship: Generally available at fintech firms (Stripe, Wise, Revolut); verify
  per employer. Not available at MAS/CSA/government roles (citizens/PRs only).
compass_score_typical: Varies; LLM from NUS/SMU with bank experience typically meets
  EP3+ threshold at fintech employers.
top_employers_smu:
- stripe_singapore
- dbs
- ocbc
- uob
- wise
- revolut
- binance
- crypto_com
- monetary_authority_of_singapore
recruiting_timeline: Rolling hiring; compliance talent market extremely tight in Singapore.
  First role typically at major bank (DBS, OCBC, UOB) for 2–3 years to build AML/KYC
  rigor, then transition to fintech for faster growth. Fintech roles often filled
  via referrals and headhunters.
international_realistic: Yes, at private fintech employers. Not eligible for MAS/CSA/government
  compliance roles (Singapore citizens/PRs only).
entry_paths:
- AML Analyst at major Singapore bank (DBS/OCBC/UOB)
- Compliance Officer at financial crime firm (Mantas, Sanction Scanner contractor)
- Associate Legal Counsel at fintech (post-LLM)
- Regulatory affairs role at MAS-regulated entity
salary_range_2024: 'Associate Compliance Officer: SGD 130–180K; Senior Compliance
  Officer: SGD 160–220K; Manager/Head of Compliance: SGD 200–280K+. Stripe-specific:
  Associate Legal Counsel SGD ~110K total comp, Senior Legal Counsel SGD ~156K, Manager
  Compliance SGD ~217K, Head of Compliance Program SGD ~334K (base SGD 200K + bonus
  30% + profit-sharing + equity 0.18%).'
typical_background: LLM in International Law, Financial Crime, or Regulatory Law (NUS/SMU
  preferred). 2–3 years AML/KYC experience is baseline. Bank compliance experience
  highly valued before fintech move. CCEP (Certified Compliance and Ethics Professional)
  growing in importance; CFCS (Certified Financial Crime Specialist) also valued.
  Basic SQL, SIEM familiarity, and e-discovery tools increasingly expected.
counselor_contact: Dr. Patricia Lim, Career Counselor - Law & Governance
notes: 'Career trajectory: 6–8 years to Head of Compliance (Aditya achieved in ~5
  years due to fintech tailwinds). Lateral moves to General Counsel, Chief Risk Officer,
  or regulatory roles (CSA, MAS) possible after 10+ years. LLM > JD for in-house compliance
  specialization — deep statutory expertise (FATF, PSA, PDPA) more valuable than broad
  legal training. CCEP credential growing; position as fintech compliance equivalent
  of CFA for investment track. Regulatory relationships with MAS officers are strategic
  advantage — cultivate through consultations, roundtables, feedback submissions.
  Key certifications: CCEP, CFCS, FCA (Financial Crime Analyst). Bar admission not
  recommended if targeting in-house compliance. Technical differentiators: SQL, SIEM,
  Tableau, e-discovery tools, ML/AI familiarity for transaction monitoring roles.'
structured:
  salary_min_sgd: 95000
  salary_max_sgd: 110000
track_name: Fintech Compliance
