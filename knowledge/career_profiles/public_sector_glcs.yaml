recruiting_timeline: 'Annual postgrad recruitment: campus recruiting Aug–Oct for Jan
  intake. Highly selective (100+ applicants per 10–15 positions). Outside postgrad
  cohort: lateral hiring requires MBA + experience.'
entry_paths:
- MSc postgrad recruitment program (MAS, EDB, HDB, CSA — annual cohort, 10–15 positions,
  highly selective)
- PhD entry for research-specialist roles
- MBA lateral hire (mid-career, slower path)
- Campus recruiting (top-ranked MSc cohort targeted directly)
salary_range_2024: 'Entry (Economist/Analyst, MSc entry): SGD 70,000–90,000 base +
  ~1 month bonus + CPF 20% employer contribution + 3–5% annual increment. Mid-level
  (Senior Economist/Manager, 5–7 yrs): SGD 95,000–140,000. Senior (Specialist/Director,
  10+ yrs): SGD 150,000–200,000+. Government comp typically 35–45% below equivalent
  private sector (fintech, banking) roles. CPF matching and job security are key non-monetary
  benefits.'
notes: 'Singapore government statutory boards (MAS, EDB, HDB, CSA) restrict roles
  to Singapore citizens and PRs — EP not applicable. MSc Financial Economics (not
  MBA, not PhD) is optimal credential for central bank and statutory board entry.
  Thesis quality on policy-relevant topics (inflation, labor, capital flows) is a
  recruitment signal. Government economics = prestige + research focus + job security
  + 35–45% comp discount vs. private sector. Exit routes narrow: academic, international
  orgs (IMF, World Bank, ADB), think tanks. Warren Lim (SMU MSc Fin Econ ''23, MAS
  Economist) available as alumni mentor.'
structured:
  salary_min_sgd: 70000
  salary_max_sgd: 90000
career_type: Public Sector / Government Economics
ep_sponsorship: Not applicable. Singapore statutory boards (MAS, EDB, HDB, CSA) restrict
  hiring to Singapore citizens and PRs only. Employment Pass sponsorship is not offered
  for these roles.
international_realistic: false
top_employers_smu:
- Monetary Authority of Singapore (MAS)
- Economic Development Board (EDB)
- Housing & Development Board (HDB)
- Cyber Security Agency (CSA)
- Ministry of Trade and Industry (MTI)
- Ministry of Finance (MOF)
- Ministry of Manpower (MOM)
- Singapore Department of Statistics (SingStat)
typical_background: SMU MSc Financial Economics or equivalent postgraduate degree
  in economics from a top-ranked university. Strong quantitative and econometric skills,
  with thesis or research work on policy-relevant topics such as inflation, labor
  markets, or capital flows. Singapore citizen or PR status is mandatory; prior internship
  experience at a statutory board or government ministry is a strong differentiator.
