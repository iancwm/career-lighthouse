notes: 'COUNSELOR ACTION REQUIRED (Mr. Vikram Nair, March 2025): Develop dedicated
  visa resources for international MBA candidates. Resources to include: (1) Tech.Pass
  eligibility checklist (salary threshold SGD 30K/month, sector expertise documentation,
  application steps, SGD 2,220 fee); (2) PR application roadmap (5-year residency
  → application → 4–6 month processing → 5-year PR → 2-year wait → citizenship eligibility);
  (3) Multi-country work considerations for international VC/finance professionals
  (India business visa: 6–12 weeks processing; Vietnam; Indonesia); (4) EP vs. Tech.Pass
  comparison table; (5) Partnership-track regulatory requirements by industry. Source
  material: Isabella Chen (GGV) call notes, March 10, 2025.'
career_type: Venture Capital / Private Equity / Investment Management
entry_paths:
- Associate at early-stage or growth-stage VC fund
- Investment Analyst at corporate venture arm (e.g., Temasek, GIC, Singtel Innov8)
- MBA Associate via on-campus recruiting at top-tier VC/PE firms
- Lateral hire from investment banking, consulting, or tech operations
- Entrepreneur-in-Residence (EIR) pathway for operators transitioning to VC
ep_sponsorship: EP sponsorship is standard for VC/PE Associate and Analyst roles at
  established funds; however, smaller or emerging fund managers may have limited HR
  infrastructure to support EP applications. Candidates with strong sector expertise
  (deep tech, fintech, SEA markets) are more competitive. Tech.Pass is a viable alternative
  for senior candidates meeting the SGD 30K/month salary threshold.
international_realistic: true
recruiting_timeline: VC/PE recruiting in Singapore does not follow a rigid on-cycle
  calendar like bulge-bracket banking. Most hiring occurs on a rolling, off-cycle
  basis throughout the year, with slight clustering in Q1 (January–March) and Q3 (July–September).
  MBA candidates should begin networking 6–9 months before intended start date; formal
  applications typically open 2–4 months before the role commences.
salary_range_2024: MBA Associate roles in Singapore VC/PE typically range from SGD
  8,000–14,000/month base, with carried interest and performance bonuses at senior
  levels. Total first-year compensation for post-MBA Associates at established funds
  is approximately SGD 120,000–180,000 annually, varying significantly by fund size
  and AUM.
top_employers_smu:
- GGV Capital
- Sequoia Capital Southeast Asia
- Temasek Holdings
- GIC Private Limited
- Vertex Ventures
- Jungle Ventures
- Peak XV Partners (formerly Sequoia India/SEA)
- Monk's Hill Ventures
- Openspace Ventures
- EDBI (Economic Development Board Investments)
typical_background: Most successful MBA candidates entering VC/PE in Singapore have
  4–8 years of prior experience in investment banking, management consulting, or high-growth
  tech/startup operations. Sector specialisation in fintech, deep tech, or SEA consumer
  internet is highly valued. Prior deal exposure, a demonstrable founder network,
  or operational experience at a Series B+ startup significantly strengthens candidacy.
