career_type: Banking Technology Project & Program Management
track_name: Banking Technology Project & Program Management
match_description: Roles managing digital transformation, systems implementation,
  and product delivery in banking and financial institutions. Spans Business Systems
  Analyst, Scrum Master, Project Manager, Senior PM, and Program Manager (PMO). Requires
  hybrid Agile/Waterfall fluency, stakeholder management, and regulatory awareness.
match_keywords:
- project management
- business analyst
- scrum master
- UAT
- user acceptance testing
- requirements gathering
- agile
- waterfall
- PRINCE2
- PMP
- digital banking
- fintech transformation
- PMO
- program management
- SAFe
- stakeholder management
ep_sponsorship: DBS will sponsor EP. OCBC and UOB likely sponsor EP for qualified
  candidates. Verify current policy with HR.
top_employers_smu:
- dbs
- ocbc
- uob
- accenture
- grab
- stripe_singapore
recruiting_timeline: Rolling intake year-round. Campus hiring rare; most entry-level
  roles filled via analyst/BA progression or lateral moves from IT consulting. DBS
  hires 15–20 PM/BA/Scrum Master roles annually.
international_realistic: Realistic for EP-eligible candidates at major banks (DBS,
  OCBC, UOB). Scrum Master and BA roles are accessible entry points. Computing or
  IT degree preferred; business/analytics acceptable with demonstrated tech fluency.
entry_paths:
- Business Systems Analyst (2–3 years) → Project Manager
- Scrum Master → Project Manager
- IT Consulting (Accenture, Infosys, Cognizant) → Bank PM
- FinTech PM (Stripe, Grab) → Bank Senior PM
salary_range_2024: 'Business Systems Analyst: SGD 70–85K base + 10–15% bonus (~SGD
  76–98K total). Project Manager: SGD 95–130K base + 15–20% bonus (~SGD 109–156K total).
  Senior PM: SGD 130–170K base + 20–25% bonus + variable profit-sharing (~SGD 156–213K
  total). Program Manager (PMO): SGD 150–190K base + 25–30% bonus (~SGD 188–247K total).
  FinTech PM (SaaS-style) earn 15–20% more; consulting PM (McKinsey) earn 25–30% more
  but less stability.'
typical_background: Computing, IT, or Information Systems degree (NUS, NTU, SMU preferred).
  Business/Analytics acceptable if tech fluency demonstrated. 3–5 years tech experience
  sufficient for PM entry. Scrum Master (CSM/CSPO) certification essential early-career;
  PRINCE2 by year 3; PMP/PgMP by year 8+.
counselor_contact: Dr. Suresh Kumar, Career Counselor - Technology & IT Services
notes: 'Career velocity: BA/Scrum Master (0–3 yrs) → PM (3–5 yrs) → Senior PM (5–8
  yrs) → Program Manager/PMO or Product Management (8+ yrs). Hybrid PMs fluent in
  both Agile and Waterfall command premium comp. Waterfall best for regulatory/compliance
  projects; Agile best for UX/consumer features. Matrixed team environments require
  strong influence-without-authority skills. UAT ownership is a high-visibility differentiator.
  Exit opportunities include Product Management, Operations Management, and Strategy.
  Key KPIs: on-time delivery >95%, defect escape rate <3%, NPS >60, budget variance
  <5%. Regulatory environment requires 10–15% contingency buffer. Source: Sophia Lim
  (DBS Senior PM) interview, March 2025.'
structured:
  salary_min_sgd: 70000
