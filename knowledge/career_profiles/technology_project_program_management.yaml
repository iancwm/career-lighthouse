ep_sponsorship: Major Singapore banks and established technology or consulting
  employers may sponsor EPs for qualified candidates. Verify current policy with HR
  before advising international candidates.
top_employers_smu:
- dbs
- ocbc
- uob
- accenture
- grab
- stripe_singapore
recruiting_timeline: Rolling intake. Campus hiring rare; most entry-level roles via
  analyst/BA progression. Major banks (DBS, OCBC, UOB) hire 15–20 PM/BA/Scrum Master
  roles annually.
international_realistic: Realistic for EP-eligible candidates at major banks,
  established consultancies, and large technology employers. Business Analyst and
  Scrum Master roles are the most accessible entry points.
entry_paths:
- Business Systems Analyst (2–3 years) → Project Manager
- Scrum Master → Project Manager (3–5 years)
- IT Consulting → Bank PM
- FinTech PM → Bank Senior PM
salary_range_2024: 'Business Systems Analyst: SGD 70–85K base + 10–15% bonus. Project
  Manager: SGD 95–130K base + 15–20% bonus. Senior PM: SGD 130–170K base + 20–25%
  bonus + variable profit-sharing. Program Manager (PMO): SGD 150–190K base + 25–30%
  bonus. FinTech PM earns 15–20% more; consulting PM earns 25–30% more.'
typical_background: Computing, IT, or Information Systems degree preferred. Business/Analytics
  acceptable with demonstrated tech fluency. Scrum Master (CSM/CSPO) essential early-career;
  PRINCE2 by year 3; PMP by year 5+; PgMP by year 8+.
counselor_contact: Dr. Suresh Kumar, Career Counselor - Technology & IT Services
notes: 'Hybrid Agile/Waterfall PMs command premium compensation. Waterfall best for
  regulatory/compliance projects; Agile best for UX/consumer features. Matrixed environments
  require influence-without-authority skills. UAT ownership is high-visibility differentiator.
  Exit paths: Product Management, Operations, Strategy. Key KPIs tracked: on-time
  delivery >95%, defect escape rate <3%, NPS >60, budget variance <5%. Source: Sophia
  Lim (DBS Senior PM) interview, March 2025.'
structured:
