track_name: Financial Stability Research / Central Bank Economics
match_description: 'Ideal for candidates motivated by policy impact, regional economic
  influence, and intellectual depth over maximum compensation. Advancement driven
  by research output and policy relevance. Niche expertise (financial stability) offers
  deep credibility within central banking ecosystem but limited private sector portability.
  Recession-proof: financial stability always policy-relevant.'
match_keywords:
- financial stability
- systemic risk
- macroeconomic modeling
- VAR
- stress testing
- Basel III
- countercyclical buffers
- monetary policy
- central banking
- ASEAN economics
- fintech regulation
- cross-border capital flows
- inflation dynamics
- credit cycles
- policy research
- working papers
- Board-level briefs
ep_sponsorship: Not applicable at MAS (statutory board, Singapore citizens/PRs only).
  Regional central banks (BNM, Bank of Thailand, Bank Indonesia) may consider international
  candidates with ASEAN expertise.
top_employers_smu:
- monetary_authority_of_singapore
- bank_for_international_settlements
- international_monetary_fund
- asian_development_bank
- bank_negara_malaysia
recruiting_timeline: Annual graduate intake at MAS; applications Q1–Q2 for July/August
  start. IMF/ADB recruit year-round for Young Professionals Programs. Policy-relevant
  thesis and working paper publications strongly differentiate candidates.
international_realistic: Limited for MAS (citizens/PRs only). More accessible at IMF,
  ADB, BIS, and regional central banks for international candidates with strong research
  credentials.
entry_paths:
- Direct entry post-MSFE or MSc Econ/Fin Econ
- PhD economics for senior research roles
- MAS internship → conversion
- Philip Chua mentorship program (MSFE '16, ~60% MAS placement rate)
- Working paper publications during graduate study
- IMF/ADB Young Professionals Program
salary_range_2024: 'SGD 72K–85K (entry Economist) → SGD 95K–105K base + ~8–10% bonus
  (Senior Economist, 4–10 yrs) → SGD 130–160K (Specialist/Manager) → SGD 160–180K
  (Director). OTE Senior Economist ~SGD 113K. CPF 20% employer match. Private sector
  equivalent: SGD 180–250K+ (consulting/fintech) — MAS trade-off is policy impact
  and stability.'
typical_background: 'MSFE (preferred for financial stability/systemic risk) or MSc
  Fin Econ (monetary policy/macro). Strong quantitative skills: VAR modeling, stress-testing,
  agent-based modeling. Policy-relevant thesis topics (financial cycles, inflation
  dynamics, credit risk, fintech spillovers). Research publication record during or
  post-graduation accelerates advancement.'
counselor_contact: Dr. Suresh Kumar
notes: 'FOLLOW-UP (Dr. Suresh Kumar, April 12 2025): Build ''central banking careers''
  guide for MSFE/econ postgrad students. Contrast three paths: (1) MAS government
  path (Philip Chua model) — SGD 72K entry → SGD 160–180K director ceiling, policy
  impact, stability, limited private sector portability; (2) Academic path (NUS/NTU)
  — research output focus, tenure track, lower comp ceiling; (3) Fintech exit — higher
  comp potential (SGD 180–250K+), data skills more portable, less policy influence.
  Guide should include comp tables, timeline to promotion, EP eligibility notes, and
  Philip''s mentorship program contact.'
structured:
  salary_min_sgd: 72000
  salary_max_sgd: 85000
