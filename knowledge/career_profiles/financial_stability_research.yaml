career_type: Financial Stability Research
track_name: Financial Stability Research
match_description: Niche track for candidates seeking deep policy expertise in financial
  system stability, systemic risk, and macroprudential regulation. Research impact
  (publications + policy briefs) drives career advancement. Limited exit options (academia,
  regional central banks, IMF/ADB) but recession-proof and high institutional credibility.
match_keywords:
- financial stability
- systemic risk
- macroeconomic modeling
- VAR
- stress testing
- agent-based modeling
- Basel III
- countercyclical buffers
- ASEAN spillovers
- fintech resilience
- cross-border capital flows
- central banking
- policy research
- working papers
- Board briefs
ep_sponsorship: Not applicable for MAS — Singapore statutory board restricted to citizens
  and PRs. Regional central banks (BNM, Bank of Thailand, BI) may sponsor for international
  candidates.
top_employers_smu:
- monetary_authority_of_singapore
recruiting_timeline: Year-round; postgrad cohort intake typically May–July. Direct
  entry post-grad standard.
international_realistic: No for MAS specifically. Possible for IMF, ADB, BIS, or regional
  ASEAN central banks.
entry_paths:
- Direct entry post-grad (MSFE/PhD)
- MAS internship → conversion
- Philip Chua mentorship program (~60% MAS placement)
- Academic research → policy secondment
- IMF/ADB junior economist programs
salary_range_2024: 'Entry Economist: SGD 72K–85K; Senior Economist: SGD 95K–105K (OTE
  ~SGD 113K); Specialist/Manager: SGD 130–160K; Director: SGD 160–180K. CPF 20% employer
  match + ESOS at senior levels. Private sector equivalent (consulting/fintech): SGD
  180–250K+.'
typical_background: 'MSFE or MSc Financial Economics strongly preferred. Policy-relevant
  thesis (financial cycles, credit risk, inflation dynamics). Quantitative skills:
  VAR, stress-testing, agent-based modeling. Financial stability frameworks: Basel
  III, countercyclical buffers, systemic risk indicators. Strong written communication
  for Board-level policy briefs.'
counselor_contact: Dr. Suresh Kumar
notes: 'FOLLOW-UP (Dr. Suresh Kumar, April 2025): Build ''central banking careers''
  guide contrasting three exit paths for MSFE/econ postgrads: (1) MAS government path
  — Philip Chua model, SGD 72K entry → SGD 160–180K director ceiling, policy impact,
  stability, geographic lock-in; (2) Academic path — NUS/NTU, publish-or-perish, lower
  comp, high autonomy; (3) Fintech exit — SGD 180–250K+ at equivalent experience,
  data skills more portable, less policy influence. Guide should include comp tables,
  timeline to promotion, EP eligibility notes, and recommended degree (MSFE vs. MSc
  Fin Econ) for each path.'
structured:
  salary_min_sgd: 72000
  salary_max_sgd: 85000
compass_score_typical: Not applicable — restricted to Singapore citizens and PRs at
  MAS.
