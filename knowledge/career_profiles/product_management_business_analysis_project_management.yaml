career_type: Product Management, Business Analysis & Project Management
match_keywords:
- business analyst
- project manager
- scrum master
- product management
- UAT
- requirements gathering
- agile
- PRINCE2
- PMP
- stakeholder management
- FRD
- NFR
- design thinking
- user research
ep_sponsorship: Major Singapore banks and large technology or consulting employers
  may sponsor EPs for qualified candidates. Verify current policy with HR before
  advising international candidates.
top_employers_smu:
- dbs
- ocbc
- uob
- accenture
- grab
- stripe_singapore
recruiting_timeline: Rolling intake year-round. Entry-level roles are usually filled
  through analyst or business-analysis progression, with lateral hiring from IT
  consulting and fintech.
international_realistic: Realistic for EP-eligible candidates at major banks, large
  technology firms, and established consultancies. Business Analyst and Scrum Master
  roles are the most accessible entry points.
entry_paths:
- Business Systems Analyst (2–3 years) → Project Manager
- Scrum Master → Project Manager
- PM → Product Management (lateral, 5+ years experience)
- IT Consulting → Bank BA/PM
salary_range_2024: 'Business Systems Analyst: SGD 70–85K base + 10–15% bonus. Project
  Manager: SGD 95–130K base + 15–20% bonus. Senior PM: SGD 130–170K base + 20–25%
  bonus + variable profit-sharing. Program Manager (PMO): SGD 150–190K base + 25–30%
  bonus.'
typical_background: Computing, IT, or Information Systems degree preferred. Business/Analytics
  acceptable with tech fluency. Scrum Master (CSM/CSPO) first (6 months in); PRINCE2
  by year 3; PMP by year 5+; PgMP by year 8+.
counselor_contact: Dr. Suresh Kumar, Career Counselor - Technology & IT Services
notes: 'Sophia Lim (DBS Senior PM) recommends: spend 2–3 years in BA/requirements
  role before taking PM seat. Technical understanding (system architecture awareness,
  not coding) valuable. Product Management is a viable exit for experienced technical
  PMs — similar skill set (user research, stakeholder management, strategy). Coordinate
  with product teams at DBS, Grab, Stripe for PM-to-PM rotation opportunities. Source:
  Sophia Lim interview, March 2025.'
structured:
