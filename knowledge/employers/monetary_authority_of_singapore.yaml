application_process: Direct entry post-grad (MSFE, MSc Econ, PhD). Thesis topic relevance
  to financial stability, monetary policy, or credit risk signals strongly. Written
  + oral interview components. Policy communication assessed. Philip Chua hired 2016
  directly from MSFE. Mentorship program (Philip Chua) assists with interview prep
  and institutional context. ~60% of mentees in structured program placed at MAS.
