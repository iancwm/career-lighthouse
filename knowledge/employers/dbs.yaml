application_process: Campus hiring rare for PM roles. Most entry-level PMs come from
  analyst/BA progression internally. 70% internal talent (non-PM tech roles + business
  teams), 30% external (IT consulting firms like Accenture, Infosys, Cognizant; fintech
  PMs from Stripe, Grab). DBS Academy internal training offers PM certification path.
counsellor_contact: Atina
last_updated: '2026-07-25'
notes: 'DBS hiring 15–20 PM/BA/Scrum Master roles annually. Singapore''s largest bank
  by market cap (~SGD 500B), top-3 fintech transformer in APAC. Certifications valued:
  Scrum Master (CSM/CSPO) highly valued, PRINCE2 preferred but not required, PMP useful
  but less common in Agile-first environments. MBA not required; computing degree
  or equivalent + 3–5 years tech experience sufficient. DBS Academy (internal training)
  offers PM certification path. Offers job security + pension + health benefits +
  career stability vs. FinTech/consulting. Annual raises 2–4%; promotion increases
  15–20%. Employer pension contribution ~8%.'
counselor_contact: 'Dr. Suresh Kumar. Alumni contact: Sophia Lim (NUS Computing ''18),
  Senior PM Digital Banking Transformation — available for guest lecture on PM careers
  (target: May 2025, NUS Computing). Follow-up: Connect with NUS Computing faculty
  to arrange. Action owner: Dr. Suresh Kumar.'
