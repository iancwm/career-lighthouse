slug: government_economics
track_name: Public Sector / Government Economics
status: ready_for_publish
match_description: Policy-focused economics roles in central banks, statutory boards,
  and international economic organisations. Involves macroeconomic modeling, monetary
  policy research, inflation forecasting, and regional economic analysis. Prioritises
  public interest, intellectual rigour, and long-term stability over private-sector
  compensation.
