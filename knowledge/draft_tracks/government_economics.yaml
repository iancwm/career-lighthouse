- macroeconomics
- monetary policy
- central banking
- inflation forecasting
- econometrics
- VAR
- DSGE
- nowcasting
- policy research
- ASEAN economics
- labor market analysis
- public sector
- government economist
- policy brief
ep_sponsorship: Not applicable for Singapore government roles (MAS, EDB, HDB, CSA)
  — restricted to Singapore citizens and PRs. International organisations (IMF, World
  Bank, ADB) have own visa frameworks.
compass_score_typical: N/A — government statutory board roles not EP-eligible
