recruiting_timeline: 'FAST-TRACK (postgrad recruitment program): Annual cohort, campus
  recruiting Aug–Oct for Jan intake. 10–15 positions per org (MAS, EDB, HDB, CSA),
  100+ applicants. MSc GPA + thesis quality + top-ranked cohort visibility are primary
  selection criteria. Applications open approximately 6 months before Jan start date.
  Outside postgrad cohort: lateral hiring requires MBA + experience, significantly
  slower and more competitive.'
international_realistic: false
entry_paths:
- MSc Financial Economics postgrad recruitment program (fastest, most selective)
- PhD entry for research-specialist roles
- MBA lateral hire (slower path, mid-career)
- International org secondment (IMF, World Bank — separate application process)
salary_range_2024: 'Entry (Economist): SGD 70,000–90,000 base + ~1 month bonus + CPF
  20% employer contribution. Mid (Senior Economist, 5–7 yrs): SGD 95,000–140,000.
  Senior (Manager/Specialist, 10+ yrs): SGD 150,000–200,000+. Annual increments 2–3%
  (seniority-driven). Government comp 35–45% below fintech/private sector peers at
  equivalent experience level.'
typical_background: 'MSc Financial Economics (optimal entry credential). Strong quantitative
  skills: R, Python, Stata, econometric modeling (VAR, DSGE). Policy-relevant thesis
  (inflation, labor markets, capital flows) is a recruitment signal. Top-ranked cohort
  visibility critical for postgrad program recruitment. PhD not required for Economist
  role (overkill); bachelor alone insufficient (MAS targets MSc+).'
counselor_contact: Dr. Suresh Kumar (Warren Lim alumni call, March 30 2025)
notes: 'COUNSELLOR ACTION REQUIRED: Develop explicit guidance note for MSc Fin Econ
  students on the government vs. private sector compensation trade-off. Key data points:
  MAS Economist entry SGD 72K vs. Databricks/Stripe/Crypto.com analyst SGD 110–160K
  (35–45% gap). Government benefits: CPF 20% employer match, job security (no layoffs),
  intellectual policy work, prestige, structured progression. Private sector benefits:
  higher base, equity/bonus upside, broader exit optionality. Frame as intentional
  career choice, not default. Warren Lim case study: chose MAS over fintech peers
  deliberately. Guidance note to be created by Dr. Suresh Kumar and added to SMU career
  advisory materials.'
