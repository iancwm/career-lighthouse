- MAS model governance
- Basel III
- model risk
- PSI
- AUC-ROC
- calibration testing
- SAS
- Python
- R
- quantitative finance
- MQF
ep_sponsorship: Likely sponsored at major Singapore banks (DBS, UOB, OCBC) for MQF
  graduates. Verify current EP policy with each employer's HR.
compass_score_typical: 35–45 (MQF graduates with relevant thesis and internship experience
  typically meet EP threshold at major banks)
top_employers_smu:
- ocbc
- dbs
- uob
- ernst_and_young
- kpmg
- deloitte
recruiting_timeline: 'Campus recruiting: MQF thesis presentations (Oct–Dec), offers
  typically Jan–Mar for June start. Undergrad internships (Year 3, 6-month rotations)
  serve as pipeline. Big 3 banks attend MQF thesis presentations directly.'
international_realistic: true
entry_paths:
- SMU MQF (MSc Quantitative Finance) direct hire
- Quantitative Finance undergrad + MQF pipeline
- Year 3 internship in Model Risk Management (DBS/UOB/OCBC rotation)
- Regulatory-relevant thesis (Basel III, backtesting, model governance) as direct
  hire signal
salary_range_2024: 'Entry (0–2 yrs): SGD 70–85K base + 12–15% bonus. Senior (2–5 yrs):
  SGD 90–120K base + 12–18% bonus. Manager/Specialist (5+ yrs): SGD 130–180K base
  + bonus. OTE at senior level ~SGD 109K. CPF 20% standard. Limited equity/ESOS. Bonus
  tied to regulatory milestone closures, not individual performance metrics.'
typical_background: 'Quantitative Finance undergrad (SMU, NUS) + MQF or equivalent
  MSc. Strong statistics, stochastic processes, machine learning for risk. Programming:
  Python, R, SAS, VBA. Regulatory thesis topic (Basel III, PD backtesting) significantly
  increases direct hire probability.'
counselor_contact: Dr. Suresh Kumar
notes: 'Supply-constrained field: SMU MQF cohort ~30/year; all grads placed in model
  validation, risk analytics, or quant trading. Big 3 banks (DBS, UOB, OCBC) hire
  ~8–10 MQF grads/year into model risk. MAS 2023 Model Governance Guidelines driving
  hiring surge — UOB +4 validators, OCBC +3, DBS +2 (2023–2025). Job security high
  through 2027+ if Basel III Endgame extended. Career ceiling: Director ~SGD 140–180K
  takes 10–15 years. Exit options: consulting (EY/Deloitte model risk, SGD 120–160K
  mid-level), fintech data scientist (Databricks/Wise/Grab, SGD 110–150K), quant trading
  (SGD 150–250K total comp, volatile). Specialist track — difficult to pivot to market
  risk or operational risk without retraining. Thesis topic matters: regulatory-relevant
  thesis signals to banks; ML/fintech thesis signals to tech companies. Alumni contact:
  Cayden Lee (Senior Model Validator, OCBC, SMU QF ''21 + MQF ''23) — available for
  SMU quant alumni mentoring.'
