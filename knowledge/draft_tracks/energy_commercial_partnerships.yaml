slug: energy_commercial_partnerships
track_name: Commercial & Business Development
status: ready_for_publish
match_description: For engineers and technical professionals pivoting to commercial/business
  development roles in the energy sector (oil & gas, LNG, power generation, renewables).
  Involves contract negotiation, JV structuring, financial modeling, and multi-stakeholder
  deal management. MBA typically required for transition from ops to commercial.
match_keywords:
- LNG
- energy partnerships
- commercial manager
- power generation
- joint venture
- contract negotiation
- energy transition
- oil and gas
- process engineer
- energy MBA
- hydrogen
- CCUS
- renewables
- supply agreements
ep_sponsorship: Varies by employer. Energy majors (ExxonMobil, Shell, TotalEnergies)
  may sponsor EP for qualified candidates with domain expertise + MBA. Verify per
  employer.
compass_score_typical: Not confirmed. Likely COMPASS 40+ given salary levels and domain
  expertise requirements.
top_employers_smu:
- exxonmobil_singapore
- shell_singapore
- totalenergies_singapore
recruiting_timeline: Post-MBA recruitment (job fairs, direct applications). Hiring
  tied to commodity price cycles — stronger in oil/gas boom years. 10–15 partnership
  manager openings/year across energy majors in Singapore.
international_realistic: true
entry_paths:
- Engineering degree + 5–7 years energy ops + MBA (strongest profile)
- MBA with energy capstone/internship (weaker without domain)
- Internal transfer from technical ops role post-MBA
salary_range_2024: SGD 130–160K base (Manager, 2–3 years); SGD 160–210K (Senior Manager,
  5+ years); SGD 210K+ (Director). Bonus 15–25% tied to contract closure and partnership
  metrics. OTE SGD 150–200K+ at manager level. 15–25% higher than tech/fintech equivalents
  at same seniority.
typical_background: 'Process engineer, petroleum engineer, or energy ops professional
  (5–7 years) + MBA. Strong domain expertise in LNG, power generation, or renewables.
  Skills: contract negotiation, financial modeling (NPV/IRR), stakeholder management,
  government/regulatory engagement.'
counselor_contact: Dr. Margaret Chen
notes: 'Follow-up action: Build energy sector pathway guide for counsellors based
  on Rendall Tan alumni call (April 2025). Guide should cover: (1) Technical-to-commercial
  MBA pivot pathway, (2) Energy major hiring profiles and comp benchmarks, (3) EP
  sponsorship considerations for international candidates, (4) Energy transition urgency
  and 2027+ skills outlook. Counsellor: Dr. Margaret Chen.'
